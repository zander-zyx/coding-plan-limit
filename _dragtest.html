<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>drag test</title>
<link rel="stylesheet" href="ui/css/style.css" />
<style>body { background: #0a0a12; padding: 20px; } #plan-list { max-width: 640px; }</style>
</head>
<body>
<script>
  window.__TAURI__ = {
    core: { invoke: async (cmd, args) => { (window.__invokes = window.__invokes || []).push({ cmd, args }); return []; } },
    event: { listen: async () => {} },
  };
</script>
<script src="ui/js/common.js"></script>
<script>
  // 与 ui/js/app.js 的 setupDrag 逐行一致（invoke 用 mock 记录，reload 用空实现）
  async function reload() {}
  function setupDrag(box) {
    let dragId = null;
    let dragFromIdx = -1;
    box.querySelectorAll('.row').forEach((row, idx) => {
      row.dataset.idx = String(idx);
      row.setAttribute('draggable', 'true');
      row.addEventListener('dragstart', (e) => {
        dragId = row.querySelector('[data-toggle]')?.dataset.toggle
          || row.querySelector('[data-edit]')?.dataset.edit;
        dragFromIdx = idx;
        row.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', dragId || '');
      });
      row.addEventListener('dragend', () => {
        row.classList.remove('dragging');
        box.querySelectorAll('.row').forEach((r) => r.classList.remove('drag-over'));
      });
      row.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        if (!dragId) return;
        const overId = row.querySelector('[data-toggle]')?.dataset.toggle
          || row.querySelector('[data-edit]')?.dataset.edit;
        if (overId && overId !== dragId) row.classList.add('drag-over');
      });
      row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
      row.addEventListener('drop', async (e) => {
        e.preventDefault();
        row.classList.remove('drag-over');
        const dragRow = box.querySelector('.row.dragging');
        const overId = row.querySelector('[data-toggle]')?.dataset.toggle
          || row.querySelector('[data-edit]')?.dataset.edit;
        if (!dragId || !overId || dragId === overId || !dragRow) { dragId = null; return; }
        // 向下拖 → 放到目标之后；向上拖 → 放到目标之前
        if (dragFromIdx >= 0 && idx > dragFromIdx) {
          row.after(dragRow);
        } else {
          box.insertBefore(dragRow, row);
        }
        const ids = [...box.querySelectorAll('.row')]
          .map((r) => r.querySelector('[data-toggle]')?.dataset.toggle
            || r.querySelector('[data-edit]')?.dataset.edit)
          .filter(Boolean);
        dragId = null;
        dragFromIdx = -1;
        try {
          await invoke('reorder_plans', { ids });
        } catch (err) {
          console.error('reorder failed', err);
        }
        await reload();
      });
    });
  }
  const NOW = Math.floor(Date.now()/1000);
  const mk = (id, name, tpl) => ({
    plan: { id, template: tpl, name, enabled: true, threshold: 10, region: 'cn' },
    snapshot: { ok: true, plan_id: id, updated_at: NOW, quota: { kind: 'windows', windows: [
      { label: '5小时', used_percent: 12, reset_at: NOW + 3600 },
      { label: '本周', used_percent: 29, reset_at: NOW + 86400 }] } },
  });
  const VIEWS = [mk('a', '智谱 GLM Coding Plan', 'zhipu'), mk('b', 'Kimi For Coding', 'kimi-coding'), mk('c', 'MiniMax Coding Plan', 'minimax')];

  function renderPlans() {
    const box = document.getElementById('plan-list');
    box.innerHTML = state.views.map((v) => {
      const lead = `<div class="row-lead"><label class="switch sm"><input type="checkbox" data-toggle="${v.plan.id}" checked /><i></i></label></div>`;
      const actions = `<div class="row-actions"><button class="txt-btn" data-edit="${v.plan.id}">编辑</button></div>`;
      return rowHtml(v, { lead, actions });
    }).join('');
    setupDrag(box);
  }
  state = { views: VIEWS, settings: {}, templates: [] };
  renderPlans();
</script>
</body>
</html>
