<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<title>Design Preview</title>
<link rel="stylesheet" href="../ui/css/style.css" />
<style>
  body { background: #0a0a12; padding: 24px; display: grid; grid-template-columns: 280px 1fr; gap: 24px; align-items: start; }
  .col-title { color:#6b6680; font-size:11px; margin: 0 0 10px 4px; letter-spacing:0.06em; text-transform:uppercase; }
</style>
</head>
<body>
<script>
  const MOCK_SETTINGS = { theme: 'dark', accent: null, bar_style: 'bar', popup_plan_ids: [] };
  window.__TAURI__ = {
    core: { invoke: async (cmd) => cmd === 'get_settings' ? MOCK_SETTINGS : [] },
    event: { listen: async () => {} },
  };
  window.matchMedia = () => ({ matches: true, addEventListener() {} });
</script>
<script src="../ui/js/common.js"></script>
<script>
  for (const k in PROVIDER_META) if (PROVIDER_META[k].icon) PROVIDER_META[k].icon = '../ui/' + PROVIDER_META[k].icon;

  const NOW = Math.floor(Date.now()/1000);
  const VIEWS = [
    { plan:{id:'a',template:'zhipu',name:'智谱 GLM Coding Plan',enabled:true,threshold:10,region:'cn'},
      snapshot:{ok:true,plan_id:'a',updated_at:NOW-120,quota:{kind:'windows',windows:[
        {label:'5小时',used_percent:92.7,reset_at:NOW+8400},{label:'本周',used_percent:11.4,reset_at:NOW+200000}]}}},
    { plan:{id:'b',template:'kimi-coding',name:'Kimi For Coding',enabled:true,threshold:10,region:'cn'},
      snapshot:{ok:true,plan_id:'b',updated_at:NOW-60,quota:{kind:'windows',windows:[
        {label:'5小时',used_percent:8.0,reset_at:NOW+5000},{label:'本周',used_percent:11,reset_at:NOW+300000}]}}},
    { plan:{id:'c',template:'deepseek',name:'DeepSeek',enabled:true,threshold:10,region:'cn'},
      snapshot:{ok:true,plan_id:'c',updated_at:NOW-90,quota:{kind:'balance',amount:42.50,currency:'CNY',note:'充值 ¥40.00 · 赠送 ¥10.00'}}},
    { plan:{id:'d',template:'codex',name:'Codex Plus',enabled:true,threshold:10,region:'cn'},
      snapshot:{ok:true,plan_id:'d',updated_at:NOW-30,quota:{kind:'windows',windows:[
        {label:'5小时',used_percent:96.2,reset_at:NOW+3000}]}}},
  ];
  window.__barStyle = 'bar';

  // 弹窗 280px
  const { primary, rest } = splitPopupViews(VIEWS, [], 10);
  let ph = primary.map(v => rowHtml(v)).join('');
  ph += `<button class="more-toggle"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg>更多 ${rest.length}</button>
         <div class="more-wrap">${rest.map(v=>rowHtml(v,{sub:true})).join('')}</div>`;
  document.write(`
    <div>
      <div class="col-title">弹窗 280px</div>
      <div class="panel" style="height:auto">
        <header class="p-head">
          <span class="status-dot warn"></span>
          <div class="head-actions"><button class="p-icon-btn update-btn">↓</button><button class="p-icon-btn">⚙</button></div>
        </header>
        <main class="p-list">${ph}</main>
        <footer class="p-foot"><span>Updated ${fmtAgo(NOW-60)}</span></footer>
      </div>
    </div>
    <div>
      <div class="col-title">主窗口 · 套餐行（含控制区 + 明细）</div>
      <div class="app" style="height:auto;border-radius:14px;overflow:hidden">
        <aside class="side" style="height:auto;padding-bottom:30px">
          <div class="logo"><span class="brand-dot"></span><span class="logo-text">Plan Limit</span></div>
          <nav><button class="active">套餐</button><button>设置</button><button>关于</button></nav>
        </aside>
        <main class="content" style="padding:22px 26px">
          <div class="view-head"><div><h1>套餐</h1><div class="sub">共 4 · 启用 4</div></div><button class="btn">＋ 添加套餐</button></div>
          ${VIEWS.map(v=>rowHtml(v,{actions:`
            <div class="row-actions">
              <label class="switch"><input type="checkbox" checked /><i></i></label>
              <button class="txt-btn">编辑</button><button class="txt-btn">删除</button>
            </div>`, main:true})).join('')}
        </main>
      </div>
    </div>`);
  // 主窗口模式展开明细
  document.querySelectorAll('#plan-list .row-tip, .content .row-tip').forEach(el=>el.style.display='block');
</script>
</body>
</html>
