    </header>
    <main id="list" class="p-list"></main>
    <footer class="p-foot"><span id="updated">…</span></footer>
  </div>
  <script src="vendor/gsap.min.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/common.js"></script>
