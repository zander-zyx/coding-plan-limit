<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plan Limit</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="logo" id="logo">
        <span class="brand-dot" id="logo-dot"></span>
        <span class="logo-text">Plan Limit</span>
        <button id="btn-update-side" class="update-side" title="发现新版本，点击前往下载" hidden>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 19h16"/></svg>
          <i class="side-pulse"></i>
        </button>
      </div>
      <nav>
        <button data-view="plans" class="active">套餐</button>
        <button data-view="settings">设置</button>
        <button data-view="about">关于</button>
      </nav>
    </aside>

    <main class="content">
      <!-- 套餐 -->
      <section id="view-plans">
        <div class="view-head">
          <div>
            <h1>套餐</h1>
            <div class="sub" id="plans-sub">…</div>
          </div>
          <button id="btn-add" class="btn">＋ 添加套餐</button>
        </div>
        <div id="plan-list"></div>
      </section>

      <!-- 设置 -->
      <section id="view-settings" hidden>
        <div class="view-head">
          <div><h1>设置</h1></div>
        </div>

        <div class="sec">
          <div class="sec-title">外观</div>
          <div class="set-row">
            <div class="label">主题</div>
            <div class="setting-ctl">
              <div class="seg" id="seg-theme">
                <button data-v="system">系统</button>
                <button data-v="light">浅色</button>
                <button data-v="dark">深色</button>
              </div>
            </div>
          </div>
          <div class="set-row">
            <div class="label">主题色</div>
            <div class="setting-ctl" id="accent-ctl">
              <div class="swatch-row" id="accent-presets"></div>
              <input type="color" id="accent-picker" value="#7c5cff" title="拾色器" />
              <input type="text" id="accent-hex" class="hex-input" placeholder="#7C5CFF" maxlength="7" spellcheck="false" title="输入 #RRGGBB" />
              <button id="accent-reset" class="txt-btn">默认</button>
            </div>
          </div>
        </div>

        <div class="sec">
          <div class="sec-title">悬浮弹窗</div>
          <div class="set-row">
            <div class="label">固定展示</div>
            <div class="popup-pick" id="popup-pick"></div>
          </div>
        </div>

        <div class="sec">
          <div class="sec-title">刷新与通知</div>
          <div class="set-row">
            <div class="label">自动刷新间隔</div>
            <div class="setting-ctl">
              <input type="number" id="in-refresh" min="10" max="86400" step="5" />
              <span style="font-size:12px;color:var(--text-t)">秒</span>
            </div>
          </div>
          <div class="set-row">
            <div class="label">提醒频率</div>
            <div class="setting-ctl">
              <div class="seg" id="seg-notify">
                <button data-v="off">不通知</button>
                <button data-v="interval">按间隔</button>
                <button data-v="count">按次数</button>
              </div>
            </div>
          </div>
          <div class="set-row" id="row-notify-interval" hidden>
            <div class="label">重复提醒间隔</div>
            <div class="setting-ctl">
              <input type="number" id="in-notify-interval" min="1" max="10080" />
              <span style="font-size:12px;color:var(--text-t)">分钟</span>
            </div>
          </div>
          <div class="set-row" id="row-notify-count" hidden>
            <div class="label">提醒频率（次数）</div>
            <div class="setting-ctl">
              <input type="number" id="in-notify-count" min="1" max="1000" />
              <span style="font-size:12px;color:var(--text-t)">次刷新</span>
            </div>
          </div>
        </div>

        <div class="sec">
          <div class="sec-title">系统</div>
          <div class="set-row">
            <div class="label">开机自动启动</div>
            <div class="setting-ctl">
              <label class="switch"><input type="checkbox" id="in-autostart" /><i></i></label>
            </div>
          </div>
          <div class="set-row">
            <div class="label">自动检查更新</div>
            <div class="setting-ctl">
              <label class="switch"><input type="checkbox" id="in-auto-update" /><i></i></label>
            </div>
          </div>
          <div class="set-row">
            <div class="label">Logo</div>
            <div class="setting-ctl">
              <img id="icon-preview" class="icon-preview" alt="" hidden />
              <div class="seg" id="seg-logo-style">
                <button data-v="color">原色</button>
                <button data-v="mono">单色</button>
                <button data-v="custom">自定义</button>
              </div>
              <button id="btn-icon-pick" class="btn ghost" hidden>选择图片</button>
            </div>
          </div>
        </div>
      </section>

      <!-- 关于 -->
      <section id="view-about" hidden>
        <div class="view-head">
          <div>
            <h1>关于</h1>
            <div class="sub">Plan Limit <span id="about-version">v…</span></div>
          </div>
        </div>
        <div class="sec">
          <div class="sec-title">更新</div>
          <div class="set-row">
            <div class="label">版本</div>
            <div class="setting-ctl"><button id="btn-check-update" class="btn ghost">检查更新</button></div>
          </div>
          <div class="set-row">
            <div class="label">GitHub 仓库</div>
            <div class="setting-ctl"><button id="btn-repo" class="btn ghost">打开</button></div>
          </div>
        </div>
        <div class="sec">
          <div class="sec-title">数据</div>
          <div class="set-row">
            <div class="label">数据目录</div>
            <div class="setting-ctl" style="max-width:320px;overflow:hidden;text-overflow:ellipsis"><span style="font-size:12px;color:var(--text-t)" id="config-dir">…</span></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 添加 / 编辑套餐弹层 -->
  <div class="modal-mask" id="plan-modal">
    <div class="modal">
      <h2 id="modal-title">添加套餐</h2>
      <div class="tpl-grid" id="tpl-grid"></div>
      <div class="form-grid" id="plan-form" hidden>
        <div class="form-item" id="f-kimi-variant-item" hidden>
          <label>Kimi 类型</label>
          <div class="seg" id="seg-kimi-variant">
            <button data-v="kimi">余额计费</button>
            <button data-v="kimi-coding">Coding Plan</button>
          </div>
          <div class="hint">余额计费查询账户余额；Coding Plan 查询 5 小时 / 周窗口用量</div>
        </div>
        <div class="form-item">
          <label>套餐名称</label>
          <input type="text" id="f-name" placeholder="例如：GLM-4.6 Pro" />
        </div>
        <div class="form-item">
          <label>套餐 Logo（可选）</label>
          <div class="logo-row">
            <img id="f-logo-preview" class="icon-preview" alt="" hidden />
            <button type="button" class="btn ghost" id="btn-logo-pick">选择图片</button>
            <button type="button" class="txt-btn" id="btn-logo-reset" hidden>恢复默认</button>
          </div>
        </div>
        <div class="form-item" id="f-region-item" hidden>
          <label>站点区域</label>
          <select id="f-region">
            <option value="cn">国内站</option>
            <option value="intl">国际站</option>
          </select>
        </div>
        <div class="form-item" id="f-bearer-item" hidden>
          <label>API Key</label>
          <input type="password" id="f-bearer" placeholder="" />
          <div class="hint" id="f-bearer-hint">在平台控制台的 API Keys 页面创建</div>
        </div>
        <div class="form-item" id="f-cookie-item" hidden>
          <label>浏览器 Cookie</label>
          <textarea id="f-cookie" rows="3" placeholder="从浏览器 DevTools 网络请求中复制完整 Cookie"></textarea>
        </div>
        <div class="form-item" id="f-cookie-key-item" hidden>
          <label>API Key（可选）</label>
          <input type="password" id="f-cookie-key" placeholder="" />
        </div>
        <div class="form-item" id="f-ak-item" hidden>
          <label>AccessKey ID</label>
          <input type="password" id="f-ak-id" placeholder="" />
          <div class="hint">阿里云主账号 RAM 密钥（非 DashScope API Key）</div>
        </div>
        <div class="form-item" id="f-ak-secret-item" hidden>
          <label>AccessKey Secret</label>
          <input type="password" id="f-ak-secret" placeholder="" />
        </div>
        <div class="form-item" id="f-baseurl-item" hidden>
          <label>站点 API 地址</label>
          <input type="text" id="f-baseurl" placeholder="" />
          <div class="hint" id="f-baseurl-hint"></div>
        </div>
        <div class="form-item">
          <label id="f-threshold-label">提醒阈值</label>
          <input type="number" id="f-threshold" min="0" max="100" step="1" />
          <div class="hint" id="f-threshold-hint"></div>
        </div>
        <div class="form-item">
          <label class="check-row">
            <input type="checkbox" id="f-enabled" checked />
            启用该套餐
          </label>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn danger" id="btn-delete" hidden>删除</button>
        <span class="spacer"></span>
        <button class="btn ghost" id="btn-cancel">取消</button>
        <button class="btn" id="btn-save" disabled>保存</button>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
